/* Connects the EASTSIDER app to its Apps Script API (no Google login cookies → works with any number of Google accounts). */
(function () {
  var API = (window.CREWTRACK_API || '').trim();
  function friendly(e) {
    var m = (e && e.message) || String(e);
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Cannot reach the server. Check your internet connection and try again.';
    return m;
  }
  function mk(s, f) {
    return new Proxy({}, { get: function (_, n) {
      if (n === 'withSuccessHandler') return function (h) { return mk(h, f); };
      if (n === 'withFailureHandler') return function (h) { return mk(s, h); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API) && !/^http:\/\/localhost/.test(API)) {
          f && f(new Error('App not configured: put your Apps Script /exec link in config.js'));
          return;
        }
        fetch(API, { method: 'POST', body: JSON.stringify({ fn: n, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', credentials: 'omit' })
          .then(function (r) { if (!r.ok) throw new Error('Server error (' + r.status + '). Try again in a minute.'); return r.text(); })
          .then(function (t) {
            var j;
            try { j = JSON.parse(t); } catch (e) { throw new Error('The server did not answer correctly. Check that the Apps Script deployment has access "Anyone" and that config.js has the right /exec link.'); }
            if (j.ok) { s && s(j.result); } else { f && f(new Error(j.error)); }
          })
          .catch(function (e) { f && f(new Error(friendly(e))); });
      };
    } });
  }
  window.google = { script: { run: mk(null, null) } };
})();

const S = { token: null, boot: null, tab: null, week: null, ts: null, exp: null, review: null, analytics: null, charts: [], notif: null };
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = n => '$' + Math.round(Number(n) || 0).toLocaleString('en-US');

/* ---------- server calls ---------- */
let busyCount = 0;
function busy(on) { busyCount += on ? 1 : -1; $('#busy').classList.toggle('hidden', busyCount <= 0); }
function call(fn, ...args) {
  busy(true);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => { busy(false); resolve(r); })
      .withFailureHandler(err => {
        busy(false);
        const msg = (err && err.message) || String(err);
        if (msg.indexOf('AUTH:') >= 0) { toast(msg.replace(/^.*AUTH:\s*/, ''), 'bad'); doLogout(true); }
        reject(new Error(msg.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')));
      })[fn](...args);
  });
}
function toast(msg, kind) {
  const d = document.createElement('div'); d.className = 'toast ' + (kind || ''); d.textContent = msg;
  const box = $('#toast'); box.appendChild(d); while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => d.remove(), kind === 'bad' ? 7000 : 3500);
}
const fail = e => toast(e.message || String(e), 'bad');

  let o = '<option value="">--</option>';

    const v = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

function lineHours(l) { const s = toMin(l.start), e = toMin(l.end); if (isNaN(s) || isNaN(e) || e <= s) return 0; return Math.max(0, (e - s - (+l.breakMin || 0)) / 60); }

/* =====================================================================
   EMPLOYEE – TIMESHEET
   ===================================================================== */
function viewTimesheet(week) {
  if (week) S.week = week;
  call('getTimesheet', S.token, S.week, null).then(r => {
    S.ts = { weekStart: r.weekStart, header: r.header, dirty: false,
      lines: r.entries.map(e => ({ date: e.Date, projectId: e.ProjectID, start: e.StartTime, end: e.EndTime, breakMin: +e.BreakMinutes || 0, notes: e.Notes })),
      notes: r.header ? r.header.EmployeeNotes : '' };
    drawTimesheet();
  }).catch(fail);
}
function tsLocked() { return S.ts.header && S.ts.header.Status === 'Approved'; }
function drawTimesheet() {
  const t = S.ts, h = t.header, locked = tsLocked();
  let banner = '';
  if (!h) banner = `<div class="banner info">Fill in every day you worked (7:00 AM – 10:00 PM), then press <b>Submit week</b>. You can save a draft at any time.</div>`;
  else if (h.Status === 'Draft') banner = `<div class="banner info">Draft saved ${esc(h.UpdatedAt)} – not submitted yet.</div>`;
  else if (h.Status === 'Submitted') banner = `<div class="banner warn">Submitted ${esc(h.SubmittedAt)} – waiting for admin review. You can still correct and re-submit.</div>`;
  else if (h.Status === 'Approved') banner = `<div class="banner good">Approved by ${esc(h.ReviewedBy)} on ${esc(h.ReviewedAt)}. This week is locked.${h.AdminComment ? '<br>Comment: ' + esc(h.AdminComment) : ''}</div>`;
  else if (h.Status === 'Rejected') banner = `<div class="banner bad"><b>Rejected</b> by ${esc(h.ReviewedBy)}: ${esc(h.AdminComment)}<br>Please fix and submit again.</div>`;
  let days = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(t.weekStart, i);
    const idx = t.lines.map((l, j) => [l, j]).filter(([l]) => l.date === d);
    const total = idx.reduce((a, [l]) => a + lineHours(l), 0);
    days += `<div class="day">
      <div class="dayhead"><b>${DOW[i]} ${pretty(d)}</b><span class="muted small">${total ? hrs(total) + ' h' : ''}</span><span class="spacer"></span>
        ${locked ? '' : `${i > 0 ? `<button class="btn sm ghost" onclick="tsCopyPrev('${d}')">Copy previous day</button>` : ''}<button class="btn sm" onclick="tsAdd('${d}')">+ Add entry</button>`}</div>
      <div class="daybody">${idx.length ? idx.map(([l, j]) => tsLineHtml(l, j, locked)).join('') : `<div class="empty">No hours</div>`}</div>
    </div>`;
  }
  const total = t.lines.reduce((a, l) => a + lineHours(l), 0);
  $('#main').innerHTML = `
    <div class="card"><div class="cardhead"><h2>My timesheet</h2>${h ? pill(h.Status) : pill('Draft', 'Not started')}</div>${weekNav('viewTimesheet')}</div>
    ${banner}
    ${days}
    <div class="card"><div class="field"><label for="tsNotes">Notes for the admin (optional)</label><textarea id="tsNotes" ${locked ? 'disabled' : ''} oninput="S.ts.notes=this.value;S.ts.dirty=true">${esc(t.notes)}</textarea></div></div>
    <div class="totalbar">
      <div><div class="tiny">Week total</div><div class="big" id="tsTotal">${hrs(total)} h</div></div>
      ${total > 40 ? `<span class="pill Submitted">${hrs(total - 40)} h overtime</span>` : ''}
      <div class="spacer"></div>
      ${locked ? '' : `<button class="btn" onclick="tsSave(false)">Save draft</button><button class="btn primary" onclick="tsSave(true)">${h && (h.Status === 'Submitted' || h.Status === 'Rejected') ? 'Re-submit week' : 'Submit week'}</button>`}
    </div>`;
}
function tsLineHtml(l, j, locked) {
  const dis = locked ? 'disabled' : '';
  return `<div class="entry" data-j="${j}">
    <div class="proj"><span class="lbl">Job site</span><select ${dis} onchange="tsSet(${j},'projectId',this.value)" aria-label="Job site">${projectOptions(l.projectId)}</select></div>
    <div><span class="lbl">Start</span><select ${dis} onchange="tsSet(${j},'start',this.value)" aria-label="Start time">${timeOptions(l.start)}</select></div>
    <div><span class="lbl">End</span><select ${dis} onchange="tsSet(${j},'end',this.value)" aria-label="End time">${timeOptions(l.end)}</select></div>
    <div><span class="lbl">Break</span><select ${dis} onchange="tsSet(${j},'breakMin',+this.value)" aria-label="Break">${breakOptions(l.breakMin)}</select></div>
    <div class="notes"><span class="lbl">Notes</span><input ${dis} value="${esc(l.notes)}" placeholder="What you did (optional)" oninput="tsSet(${j},'notes',this.value,true)" aria-label="Notes"></div>
    <div class="hrs" id="lh${j}">${hrs(lineHours(l))} h</div>
    <div>${locked ? '' : `<button class="iconbtn" title="Remove" aria-label="Remove entry" onclick="tsDel(${j})">${ICON.x}</button>`}</div>
  </div>`;
}
function tsSet(j, k, v, quiet) {
  S.ts.lines[j][k] = v; S.ts.dirty = true;
  if (quiet) return;
  if (k === 'start' && v) { const l = S.ts.lines[j]; if (!l.end || toMin(l.end) <= toMin(v)) { const e = Math.min(toMin(v) + 8 * 60 + 30, S.boot.dayEndMin); l.end = String(Math.floor(e / 60)).padStart(2, '0') + ':' + String(e % 60).padStart(2, '0'); } }
  drawTimesheet();
}
function tsAdd(d) {
  const same = S.ts.lines.filter(l => l.date === d);
  const lastProj = (S.ts.lines[S.ts.lines.length - 1] || {}).projectId || '';
  let start = '07:00', end = '15:30', br = 30;
  if (same.length) {
    const last = same.reduce((a, l) => toMin(l.end) > toMin(a.end) ? l : a, same[0]);
    const s = toMin(last.end); if (isNaN(s) || s >= S.boot.dayEndMin) return toast('This day is already filled until 10:00 PM.', 'bad');
    const e = Math.min(s + 120, S.boot.dayEndMin);
    const f = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    start = f(s); end = f(e); br = 0;
  }
  S.ts.lines.push({ date: d, projectId: lastProj, start, end, breakMin: br, notes: '' });
  S.ts.dirty = true; drawTimesheet();
}
function tsCopyPrev(d) {
  const prev = S.ts.lines.filter(l => l.date === addDays(d, -1));
  if (!prev.length) return toast('Previous day has no entries to copy.');
  S.ts.lines = S.ts.lines.filter(l => l.date !== d).concat(prev.map(l => Object.assign({}, l, { date: d })));
  S.ts.dirty = true; drawTimesheet();
}
function tsDel(j) { S.ts.lines.splice(j, 1); S.ts.dirty = true; drawTimesheet(); }
function tsSave(submit) {
  const lines = S.ts.lines;
  if (submit) {
    const total = lines.reduce((a, l) => a + lineHours(l), 0);
    if (!confirm(`Submit ${hrs(total)} hours for the week of ${weekLabel(S.ts.weekStart)}?`)) return;
  }
  call('saveTimesheet', S.token, { weekStart: S.ts.weekStart, entries: lines, notes: S.ts.notes || '' }, !!submit).then(r => {
    toast(submit ? 'Week submitted. The admin has been notified.' : 'Draft saved.', 'good');
    S.ts.header = r.header; S.ts.dirty = false; drawTimesheet();
  }).catch(fail);
}

function projName(id) { const p = S.boot.projects.find(p => p.ProjectID === id); return p ? p.Name : ''; }
function markDrop() { const d = $('#exDrop'); if (!d) return; d.classList.add('has'); d.textContent = '✓ ' + S.exp.pendingFile.name + ' (tap to change)'; }
async function expPickFile(ev) {
  const f = ev.target.files[0]; if (!f) return;
  if (!/^image\//.test(f.type) && f.type !== 'application/pdf' && !/\.(heic|heif)$/i.test(f.name)) return toast('Please choose a photo or PDF.', 'bad');
  try { S.exp.pendingFile = await prepFile(f); markDrop(); } catch (e) { fail(e); }
}
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function prepFile(file) {
  const base = (file.name || 'receipt').replace(/\.[^.]+$/, '');
  if (/^image\/(jpeg|png|webp|gif|bmp)/.test(file.type)) {
    try {
      const url = await readAsDataURL(file);
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1800, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const out = c.toDataURL('image/jpeg', 0.82);
      return { name: base + '.jpg', mimeType: 'image/jpeg', data: out.split(',')[1], preview: out };
    } catch (e) { /* fall back to raw upload */ }
  }
  if (file.size > 15 * 1024 * 1024) throw new Error('File is larger than 15 MB.');
  const url = await readAsDataURL(file);
  const mime = file.type || (/\.(heic|heif)$/i.test(file.name) ? 'image/heic' : 'application/octet-stream');
  return { name: file.name || 'receipt', mimeType: mime, data: url.split(',')[1], preview: /^image\/(jpeg|png|webp|gif)/.test(mime) ? url : '' };
}
function expAdd(ev) {
  ev.preventDefault();
  const mode = S.exp.mode || 'Personal';
  const d = { mode, date: $('#exDate').value, projectId: $('#exProj').value, type: $('#exType').value, amount: Math.round(parseFloat($('#exAmt').value) * 100) / 100,
    supplier: $('#exSup').value.trim(), description: $('#exDesc').value.trim(), card: $('#exCard') ? $('#exCard').value : '' };
  if (!d.date || !d.projectId || !d.type || !(d.amount > 0) || (!d.supplier && mode !== 'Allowance')) return toast('Fill in date, job site, type, amount and supplier.', 'bad');
  if (mode === 'Company Card' && $('#exCard') && !d.card) return toast('Choose which company card was used.', 'bad');
  if (!S.exp.pendingFile && mode !== 'Allowance') return toast('Attach a picture of the receipt.', 'bad');
  Object.assign(d, { file: S.exp.pendingFile || null, preview: S.exp.pendingFile ? S.exp.pendingFile.preview : '' });
  S.exp.drafts.push(d); S.exp.pendingFile = null; S.exp.lastProj = d.projectId; S.exp.lastDate = d.date;
  drawExpenses(); toast('Added. Add more or press Submit.');
}
async function expSubmit() {
  const drafts = S.exp.drafts; if (!drafts.length) return;
  $('#exSubmit').disabled = true;
  try {
    for (let i = 0; i < drafts.length; i++) {
      if (drafts[i].fileId || !drafts[i].file) continue;
      $('#exProg').textContent = `Uploading receipt ${i + 1} of ${drafts.length}…`;
      const f = drafts[i].file;
      const up = await call('uploadReceipt', S.token, mondayOf(drafts[i].date), { name: f.name, mimeType: f.mimeType, data: f.data });
      drafts[i].fileId = up.fileId;
    }
    $('#exProg').textContent = 'Saving…';
    const r = await call('submitExpenses', S.token, { items: drafts.map(d => ({ mode: d.mode, card: d.card, date: d.date, projectId: d.projectId, type: d.type, amount: d.amount, supplier: d.supplier, description: d.description, fileId: d.fileId || '' })) });
    S.exp.drafts = [];
    toast(`${r.count} expense(s) submitted (${money(r.total)}${r.payable !== r.total ? ', ' + money(r.payable) + ' to be paid back' : ''}).` + (r.tools ? ` ${r.tools} logged as tool/equipment purchase.` : ''), 'good');
    viewExpenses();
  } catch (e) { fail(e); const b = $('#exSubmit'); if (b) b.disabled = false; $('#exProg').textContent = ''; }

      <div class="grow"><div class="t">${esc(t.EmployeeName)}</div><div class="tiny">${weekLabel(t.WeekStart)} · sent ${esc(t.SubmittedAt)}</div></div>
      <div class="num"><b>${hrs(t.TotalHours)} h</b><div>${pill(t.Status)}</div></div></div>`).join('') || '<div class="tiny" style="padding:0 12px 10px">None</div>'}
    <div style="padding:12px 12px 6px;border-top:1px solid var(--border)"><h3 style="margin:0">Expenses <span class="muted">(${r.expenseGroups.length})</span></h3></div>

      <div class="grow"><div class="t">${esc(g.EmployeeName)}</div><div class="tiny">${weekLabel(g.WeekStart)} · ${g.count} item${g.count > 1 ? 's' : ''}${g.tools ? ' · ' + g.tools + ' tool' : ''}</div></div>
      <div class="num"><b>${money(g.total)}</b><div>${g.pending ? pill('Submitted', g.pending + ' to review') : g.rejected && !g.approved ? pill('Rejected') : pill('Approved', g.rejected ? 'Done' : 'Approved')}</div></div></div>`).join('') || '<div class="tiny" style="padding:0 12px 12px">None</div>'}`;

function selQueue(id) { $$('.qitem').forEach(q => q.classList.toggle('sel', q.dataset.id === id)); }

/* ---- timesheet review ---- */
function openTs(id) {
  selQueue(id);
  call('adminGetTimesheet', S.token, id).then(r => {
    S.rts = { id, header: r.header, weekStart: r.weekStart, edited: false,
      lines: r.entries.map(e => ({ date: e.Date, projectId: e.ProjectID, start: e.StartTime, end: e.EndTime, breakMin: +e.BreakMinutes || 0, notes: e.Notes })) };
    drawRts();
    if (window.innerWidth < 960) $('#rvDetail').scrollIntoView({ behavior: 'smooth' });
  }).catch(fail);
}
function drawRts() {
  const t = S.rts, h = t.header, total = t.lines.reduce((a, l) => a + lineHours(l), 0);
  const days = Array.from({ length: 7 }, (_, i) => addDays(t.weekStart, i));
  const perDay = days.map(d => t.lines.filter(l => l.date === d).reduce((a, l) => a + lineHours(l), 0));
  $('#rvDetail').innerHTML = `<div class="card">
    <div class="cardhead"><h2>${esc(h.EmployeeName)} – timesheet</h2>${pill(h.Status)}</div>
    <div class="muted small" style="margin-bottom:10px">${weekLabel(t.weekStart)} · submitted ${esc(h.SubmittedAt)}${h.ReviewedAt ? ' · reviewed by ' + esc(h.ReviewedBy) + ' ' + esc(h.ReviewedAt) : ''}</div>
    ${h.EmployeeNotes ? `<div class="banner info"><b>Employee note:</b> ${esc(h.EmployeeNotes)}</div>` : ''}
    ${h.AdminComment ? `<div class="banner ${h.Status === 'Rejected' ? 'bad' : 'good'}">Admin comment: ${esc(h.AdminComment)}</div>` : ''}
    <div class="kpis" style="grid-template-columns:repeat(7,minmax(70px,1fr));overflow-x:auto">${days.map((d, i) => `<div class="kpi" style="padding:8px"><div class="k">${DOW[i]} ${pretty(d)}</div><div class="v" style="font-size:18px">${hrs(perDay[i])}</div></div>`).join('')}</div>
    <div class="tablewrap edit-grid"><table><tr><th>Day</th><th>Job site</th><th>Start</th><th>End</th><th>Break</th><th>Notes</th><th class="num">Hours</th><th></th></tr>
    ${t.lines.map((l, j) => `<tr>
      <td><select onchange="rtsSet(${j},'date',this.value)">${days.map((d, i) => `<option value="${d}" ${d === l.date ? 'selected' : ''}>${DOW[i]} ${pretty(d)}</option>`).join('')}</select></td>
      <td><select onchange="rtsSet(${j},'projectId',this.value)">${projectOptions(l.projectId, true)}</select></td>
      <td><select onchange="rtsSet(${j},'start',this.value)">${timeOptions(l.start)}</select></td>
      <td><select onchange="rtsSet(${j},'end',this.value)">${timeOptions(l.end)}</select></td>
      <td><select onchange="rtsSet(${j},'breakMin',+this.value)">${breakOptions(l.breakMin)}</select></td>
      <td><input value="${esc(l.notes)}" oninput="S.rts.lines[${j}].notes=this.value;S.rts.edited=true"></td>
      <td class="num"><b>${hrs(lineHours(l))}</b></td>
      <td><button class="iconbtn" aria-label="Remove line" onclick="S.rts.lines.splice(${j},1);S.rts.edited=true;drawRts()">${ICON.x}</button></td></tr>`).join('')}
    <tfoot><tr><td colspan="6">Week total ${total > 40 ? `<span class="pill Submitted">${hrs(total - 40)} h overtime</span>` : ''}</td><td class="num">${hrs(total)}</td><td></td></tr></tfoot></table></div>
    <div class="row" style="margin:10px 0"><button class="btn sm" onclick="S.rts.lines.push({date:S.rts.weekStart,projectId:'',start:'07:00',end:'15:30',breakMin:30,notes:''});S.rts.edited=true;drawRts()">+ Add line</button>
      ${t.edited ? '<span class="pill Submitted">Edited – changes will be saved with your decision</span>' : ''}</div>
    <div class="field"><label for="rtsComment">Comment to employee ${h.Status === 'Submitted' ? '(required if rejecting)' : ''}</label><textarea id="rtsComment" placeholder="Optional for approval"></textarea></div>
    <div class="row" style="margin-top:12px">
      <button class="btn good" onclick="rtsDecide('approve')">${t.edited ? 'Save edits & approve' : 'Approve'}</button>
      <button class="btn bad" onclick="rtsDecide('reject')">Reject</button>
      ${t.edited ? `<button class="btn" onclick="rtsDecide('save')">Save edits only</button><button class="btn ghost" onclick="openTs('${esc(t.id)}')">Undo edits</button>` : ''}
      <span class="spacer"></span><button class="btn ghost danger" onclick="adminDel('timesheet','${esc(t.id)}','this timesheet',()=>viewReview())">Delete</button>
    </div></div>`;
}
function rtsSet(j, k, v) { S.rts.lines[j][k] = v; S.rts.edited = true; drawRts(); }
function rtsDecide(action) {
  const c = $('#rtsComment').value.trim();
  if (action === 'reject' && !c) return toast('Write a reason so the employee knows what to fix.', 'bad');
  call('adminReviewTimesheet', S.token, S.rts.id, action, c, S.rts.edited ? S.rts.lines : null).then(() => {
    toast(action === 'approve' ? 'Timesheet approved.' : action === 'reject' ? 'Timesheet rejected – employee notified.' : 'Edits saved.', 'good');
    const id = S.rts.id; viewReviewKeep(() => openTs(id));
  }).catch(fail);
}
function viewReviewKeep(after) {
  call('adminListSubmissions', S.token, S.reviewFilter).then(r => { S.review = r; drawQueue(); if (after) after(); }).catch(fail);
  call('adminListSubmissions', S.token, { status: 'Submitted' }).then(setReviewCount).catch(() => {});
}

/* ---- expense review ---- */
function thumbUrl(id) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w400'; }
function openExpGroup(empId, ws) {
  selQueue(empId + '|' + ws);
  call('adminGetExpenseGroup', S.token, empId, ws).then(list => { S.rex = { empId, ws, list }; drawRex(); if (window.innerWidth < 960) $('#rvDetail').scrollIntoView({ behavior: 'smooth' }); }).catch(fail);
}
function drawRex() {
  const x = S.rex, pend = x.list.filter(e => e.Status === 'Submitted');
  const total = x.list.reduce((a, e) => a + (+e.Amount || 0), 0);
  $('#rvDetail').innerHTML = `<div class="card">
    <div class="cardhead"><h2>${esc((x.list[0] || {}).EmployeeName || '')} – expenses</h2><b class="num">${money(total)}</b></div>
    <div class="muted small" style="margin-bottom:10px">${weekLabel(x.ws)} · ${x.list.length} item(s) · ${pend.length} waiting</div>
    ${pend.length > 1 ? `<div class="row" style="margin-bottom:12px"><button class="btn good" onclick="rexApproveAll()">Approve all ${pend.length} waiting (${money(pend.reduce((a, e) => a + (+e.Amount || 0), 0))})</button></div>` : ''}
    ${x.list.map((e, i) => `<div class="rev-exp" id="rex${i}">
      <div>${e.ReceiptFileID ? `<a class="thumbbig" href="${esc(e.ReceiptURL)}" target="_blank" rel="noopener" title="Open receipt in Drive"><img src="${thumbUrl(e.ReceiptFileID)}" alt="Receipt" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Open receipt'}))"></a>
        <a class="small" href="${esc(e.ReceiptURL)}" target="_blank" rel="noopener">Open receipt in Drive ${ICON.ext}</a>` : `<div class="thumbbig muted">No receipt<br>(allowance)</div>`}</div>
      <div>
        <div class="row" style="margin-bottom:8px;align-items:center">${pill(e.Status)} ${e.IsTool === 'Yes' ? pill('tool', 'Tool / equipment') : ''} ${payPill(e)} ${e.PayrollRunID ? pill('neutral', 'Paid ' + esc(e.PayrollRunID)) : ''} <span class="tiny">sent ${esc(e.SubmittedAt)}${e.ReviewedAt ? ' · reviewed ' + esc(e.ReviewedBy) + ' ' + esc(e.ReviewedAt) : ''}</span></div>
        <div class="fields edit-grid">
          <div class="field"><label>Date</label><input type="date" data-k="Date" value="${e.Date}"></div>
          <div class="field"><label>Job site</label><select data-k="ProjectID">${projectOptions(e.ProjectID, true)}</select></div>
          <div class="field"><label>Paid with</label><select data-k="PaymentMethod" onchange="rexMode(${i},this.value)">${['Personal', 'Company Card', 'Allowance'].map(m => `<option value="${m}" ${payOf(e) === m ? 'selected' : ''}>${PAY[m]}</option>`).join('')}</select></div>
          <div class="field"><label>Type</label><select data-k="ExpenseType">${rexTypeOptions(payOf(e), e.ExpenseType)}</select></div>
          <div class="field ${payOf(e) === 'Company Card' ? '' : 'hidden'}" data-card><label>Card</label><input data-k="CardUsed" value="${esc(e.CardUsed || '')}" list="cardList"></div>
          <div class="field"><label>Supplier</label><input data-k="Supplier" value="${esc(e.Supplier)}"></div>
          <div class="field"><label>Amount ($)</label><input type="number" step="0.01" data-k="Amount" value="${e.Amount}"></div>
          <div class="field"><label>Item</label><input data-k="Description" value="${esc(e.Description)}"></div>
        </div>
        ${e.OriginalAmount !== '' && e.OriginalAmount !== undefined ? `<div class="tiny">Originally submitted: ${money(e.OriginalAmount)}</div>` : ''}
        <label class="small" style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" data-k="IsTool" ${e.IsTool === 'Yes' ? 'checked' : ''}> Tool / equipment purchase (keep receipt in Tools register for warranty)</label>
        <div class="field"><label>Comment to employee</label><input data-k="comment" value="${esc(e.AdminComment)}" placeholder="Required if rejecting"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn sm good" onclick="rexDecide(${i},'approve')">${e.Status === 'Approved' ? 'Save & keep approved' : 'Approve'}</button>
          <button class="btn sm bad" onclick="rexDecide(${i},'reject')">Reject</button>
          <button class="btn sm" onclick="rexDecide(${i},'save')">Save changes</button>
          <span class="spacer"></span><button class="btn sm ghost danger" onclick="adminDel('expense','${e.ExpenseID}','this expense',()=>{const {empId,ws}=S.rex;viewReviewKeep(()=>openExpGroup(empId,ws));})">Delete</button>
        </div>
      </div></div>`).join('')}
    <datalist id="cardList">${(S.boot.companyCards || []).map(c => `<option value="${esc(c)}">`).join('')}</datalist>
  </div>`;
}
function rexTypeOptions(mode, sel) {
  const list = mode === 'Allowance' ? S.boot.allowanceTypes : S.boot.expenseTypes;
  return list.map(t => `<option ${t === sel ? 'selected' : ''}>${esc(t)}</option>`).join('') + (sel && list.indexOf(sel) < 0 ? `<option selected>${esc(sel)}</option>` : '');
}
function rexMode(i, m) {
  const box = $('#rex' + i);
  $('[data-k="ExpenseType"]', box).innerHTML = rexTypeOptions(m, $('[data-k="ExpenseType"]', box).value);
  $('[data-card]', box).classList.toggle('hidden', m !== 'Company Card');
}
function rexRead(i) {
  const box = $('#rex' + i), v = k => $(`[data-k="${k}"]`, box);
  return { edits: { Date: v('Date').value, ProjectID: v('ProjectID').value, ExpenseType: v('ExpenseType').value, Supplier: v('Supplier').value, Amount: v('Amount').value, Description: v('Description').value,
    IsTool: v('IsTool').checked ? 'Yes' : 'No', PaymentMethod: v('PaymentMethod').value, CardUsed: v('CardUsed').value }, comment: v('comment').value.trim() };
}
function rexDecide(i, action) {
  const e = S.rex.list[i], r = rexRead(i);
  if (action === 'reject' && !r.comment) return toast('Write a reason in the comment box before rejecting.', 'bad');
  call('adminReviewExpenses', S.token, [{ expenseId: e.ExpenseID, action, comment: r.comment, edits: r.edits }]).then(() => {
    toast(action === 'approve' ? 'Expense approved.' : action === 'reject' ? 'Expense rejected.' : 'Saved.', 'good');
    const { empId, ws } = S.rex; viewReviewKeep(() => openExpGroup(empId, ws));
  }).catch(fail);
}
function rexApproveAll() {
  const ds = S.rex.list.map((e, i) => e.Status === 'Submitted' ? Object.assign({ expenseId: e.ExpenseID, action: 'approve' }, rexRead(i)) : null).filter(Boolean);
  call('adminReviewExpenses', S.token, ds).then(() => { toast(ds.length + ' expenses approved.', 'good'); const { empId, ws } = S.rex; viewReviewKeep(() => openExpGroup(empId, ws)); }).catch(fail);
}

/* =====================================================================
   ADMIN – ANALYTICS
   ===================================================================== */

  return ({ week: [m, t], lastweek: [addDays(m, -7), addDays(m, -1)], month: [t.slice(0, 8) + '01', t], d30: [addDays(t, -29), t], d90: [addDays(t, -89), t], ytd: [t.slice(0, 4) + '-01-01', t], all: ['2000-01-01', t] })[k];
}
function viewAnalytics() {
  const f = S.aFilter = S.aFilter || { from: addDays(S.boot.today, -89), to: S.boot.today, projectId: '', employeeId: '', includePending: false };
  $('#main').innerHTML = `
    <div class="card"><div class="row">
      <div class="field"><label for="aFrom">From</label><input type="date" id="aFrom" value="${f.from}"></div>

const EXP_GROUPS = [
  ['Food', /food|meal/i], ['Gas / Fuel', /gas|fuel/i], ['Materials', /material/i], ['Tools & Equipment', /tool|equipment/i], ['Lodging & Travel', /lodg|hotel|parking|toll|travel|vehicle/i]
];
function expGroup(type) { for (const [g, re] of EXP_GROUPS) if (re.test(type)) return g; return 'Other'; }
function drawAnalytics() {
  const a = S.analytics, K = a.kpis;
  if (!a.projects.length) {
    $('#aOut').innerHTML = `<div class="kpis">${kpiTiles(a)}</div><div class="card muted">No ${a.includePending ? '' : 'approved '}hours or expenses in this period yet. ${a.includePending ? '' : 'Tick “Include not-yet-approved” to see pending submissions.'}</div>`;
    return;
  }
  const types = a.expenseTypes.map(t => t.type);
  const projRows = a.projects.map(p => `<tr><td><b>${esc(p.name)}</b>${p.client ? `<div class="tiny">${esc(p.client)}</div>` : ''}</td>
      <td class="num">${hrs(p.hours)}</td><td class="num">${money0(p.laborCost)}</td>
      ${types.map(t => `<td class="num">${p.byType[t] ? money0(p.byType[t]) : '<span class="tiny">–</span>'}</td>`).join('')}
      <td class="num">${money0(p.expenses)}</td><td class="num"><b>${money0(p.total)}</b></td>
      <td class="num">${p.budget ? money0(p.budget) : '<span class="tiny">–</span>'}</td>
      <td style="min-width:110px">${p.budget ? `<div class="bar-inline ${p.budgetUsedPct > 100 ? 'over' : ''}"><span style="width:${Math.min(100, p.budgetUsedPct)}%"></span></div><div class="tiny">${Math.round(p.budgetUsedPct)}% used</div>` : ''}</td></tr>`).join('');
  const projNames = a.projects.map(p => p.name);
  const empRows = a.employees.map(e => `<tr><td><b>${esc(e.name)}</b></td>${projNames.map(p => `<td class="num">${e.byProject[p] ? hrs(e.byProject[p]) : '<span class="tiny">–</span>'}</td>`).join('')}
      <td class="num"><b>${hrs(e.hours)}</b></td><td class="num">${e.overtime ? hrs(e.overtime) : '–'}</td><td class="num">${money0(e.laborCost)}</td><td class="num">${money0(e.expenses)}</td></tr>`).join('');
  $('#aOut').innerHTML = `
    <div class="kpis">${kpiTiles(a)}</div>
    <div class="charts">
      <div class="card"><div class="cardhead"><h3>Real cost by job site</h3></div><div class="tiny" style="margin-bottom:6px">Labor (hours × rate) + expenses</div><div class="chartbox" style="height:${Math.max(220, a.projects.length * 42 + 80)}px"><canvas id="chCost"></canvas></div></div>
      <div class="card"><div class="cardhead"><h3>Hours by job site</h3></div><div class="chartbox" style="height:${Math.max(220, a.projects.length * 34 + 40)}px"><canvas id="chHours"></canvas></div></div>
      <div class="card"><div class="cardhead"><h3>Hours by employee, split by job</h3></div><div class="chartbox" style="height:${Math.max(220, a.employees.length * 38 + 80)}px"><canvas id="chEmp"></canvas></div></div>
      <div class="card"><div class="cardhead"><h3>Expenses by category</h3></div><div class="chartbox" style="height:${Math.max(220, a.expenseTypes.length * 34 + 40)}px"><canvas id="chTypes"></canvas></div></div>
      <div class="card"><div class="cardhead"><h3>Hours per week</h3></div><div class="chartbox" style="height:240px"><canvas id="chWeekH"></canvas></div></div>
      <div class="card"><div class="cardhead"><h3>Cost per week</h3></div><div class="chartbox" style="height:240px"><canvas id="chWeekC"></canvas></div></div>
    </div>
    <div class="card"><div class="cardhead"><h3>Job cost breakdown</h3><button class="btn sm" onclick="csvFromTable('tblProj','job-costs')">Download CSV</button></div>
      <div class="tablewrap"><table id="tblProj"><thead><tr><th>Job site</th><th class="num">Hours</th><th class="num">Labor $</th>${types.map(t => `<th class="num">${esc(t)}</th>`).join('')}<th class="num">All expenses</th><th class="num">Total cost</th><th class="num">Budget</th><th>Budget used</th></tr></thead>
      <tbody>${projRows}</tbody><tfoot><tr><td>Total</td><td class="num">${hrs(K.hours)}</td><td class="num">${money0(K.laborCost)}</td>${types.map(t => `<td class="num">${money0(a.expenseTypes.find(x => x.type === t).amount)}</td>`).join('')}<td class="num">${money0(K.expenses)}</td><td class="num">${money0(K.totalCost)}</td><td></td><td></td></tr></tfoot></table></div></div>

      <tbody>${empRows}</tbody><tfoot><tr><td>Total</td>${a.projects.map(p => `<td class="num">${hrs(p.hours)}</td>`).join('')}<td class="num">${hrs(K.hours)}</td><td class="num">${hrs(K.overtime)}</td><td class="num">${money0(K.laborCost)}</td><td class="num">${money0(K.expenses)}</td></tr></tfoot></table></div>
      <div class="tiny" style="margin-top:6px">Overtime = hours above 40 in a Monday–Sunday week.</div></div>`;
  drawCharts();
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function destroyCharts() { S.charts.forEach(c => c.destroy()); S.charts = []; }
function drawCharts() {
  if (!window.Chart) return;
  destroyCharts();
  const a = S.analytics, series = [1, 2, 3, 4, 5, 6, 7, 8].map(i => cssVar('--s' + i));
  const text = cssVar('--text-2'), grid = cssVar('--grid'), surface = cssVar('--surface');
  Chart.defaults.color = text; Chart.defaults.font.family = 'system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif'; Chart.defaults.font.size = 12;
  Chart.defaults.borderColor = grid;
  const tip = { backgroundColor: cssVar('--surface'), titleColor: cssVar('--text'), bodyColor: cssVar('--text-2'), borderColor: cssVar('--border-strong'), borderWidth: 1, padding: 10 };
  const fmtMoney = v => money0(v), fmtH = v => hrs(v) + ' h';
  const hbar = (id, labels, datasets, fmt, stacked) => {
    const el = document.getElementById(id); if (!el) return;
    S.charts.push(new Chart(el, {
      type: 'bar', data: { labels, datasets: datasets.map(d => Object.assign({ borderRadius: stacked ? 0 : 4, borderSkipped: false, maxBarThickness: 26, borderColor: surface, borderWidth: stacked ? { right: 2 } : 0 }, d)) },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, interaction: { mode: stacked ? 'index' : 'nearest', axis: 'y', intersect: false },
        scales: { x: { stacked, grid: { color: grid }, ticks: { callback: fmt }, border: { display: false } }, y: { stacked, grid: { display: false }, border: { display: false } } },
        plugins: { legend: { display: datasets.length > 1, position: 'top', align: 'start', labels: { boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 2 } },
          tooltip: Object.assign({}, tip, { callbacks: { label: c => ` ${c.dataset.label ? c.dataset.label + ': ' : ''}${fmt(c.parsed.x)}` } }) } }
    }));
  };
  // 1) cost by job – labor + grouped expense categories (≤ 7 series, fixed order)
  const groups = ['Labor'].concat(EXP_GROUPS.map(g => g[0]), ['Other']);
  const costBy = a.projects.map(p => { const o = { Labor: p.laborCost }; Object.entries(p.byType).forEach(([t, v]) => { const g = expGroup(t); o[g] = (o[g] || 0) + v; }); return o; });
  const usedGroups = groups.filter(g => costBy.some(o => o[g]));
  hbar('chCost', a.projects.map(p => p.name), usedGroups.map(g => ({ label: g, data: costBy.map(o => Math.round((o[g] || 0) * 100) / 100), backgroundColor: series[groups.indexOf(g)] })), fmtMoney, true);
  // 2) hours by job
  hbar('chHours', a.projects.map(p => p.name), [{ label: 'Hours', data: a.projects.map(p => p.hours), backgroundColor: series[0] }], fmtH, false);
  // 3) hours by employee, stacked by job (top 7 jobs + Other, colors follow the job)
  const topJobs = a.projects.slice().sort((x, y) => y.hours - x.hours).filter(p => p.hours > 0).slice(0, 7).map(p => p.name);
  const jobSeries = topJobs.map((j, i) => ({ label: j, data: a.employees.map(e => e.byProject[j] || 0), backgroundColor: series[i] }));
  const otherH = a.employees.map(e => Object.entries(e.byProject).filter(([j]) => topJobs.indexOf(j) < 0).reduce((s, [, h]) => s + h, 0));
  if (otherH.some(Boolean)) jobSeries.push({ label: 'Other jobs', data: otherH, backgroundColor: cssVar('--border-strong') });
  hbar('chEmp', a.employees.map(e => e.name), jobSeries, fmtH, true);
  // 4) expenses by category
  hbar('chTypes', a.expenseTypes.map(t => t.type), [{ label: 'Amount', data: a.expenseTypes.map(t => t.amount), backgroundColor: series[1] }], fmtMoney, false);
  // 5/6) weekly trends (two charts – never a dual axis)
  const wl = a.weeks.map(w => pretty(w.week));
  const line = (id, datasets, fmt) => {
    const el = document.getElementById(id); if (!el) return;
    S.charts.push(new Chart(el, { type: 'line', data: { labels: wl, datasets: datasets.map(d => Object.assign({ borderWidth: 2, pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: d.borderColor, pointBorderColor: surface, pointBorderWidth: 2, tension: 0.25 }, d)) },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        scales: { y: { beginAtZero: true, grid: { color: grid }, ticks: { callback: fmt }, border: { display: false } }, x: { grid: { display: false }, border: { display: false } } },
        plugins: { legend: { display: datasets.length > 1, position: 'top', align: 'start', labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: Object.assign({}, tip, { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` } }) } } }));
  };
  line('chWeekH', [{ label: 'Hours', data: a.weeks.map(w => w.hours), borderColor: series[0] }], fmtH);
  line('chWeekC', [{ label: 'Labor', data: a.weeks.map(w => w.laborCost), borderColor: series[0] }, { label: 'Expenses', data: a.weeks.map(w => w.expenses), borderColor: series[1] }], fmtMoney);
}
function csvFromTable(id, name) {
  const rows = $$('#' + id + ' tr').map(tr => $$('th,td', tr).map(td => '"' + td.innerText.replace(/\n/g, ' ').replace(/"/g, '""').replace(/^–$/, '') + '"').join(','));
  downloadText(rows.join('\n'), name + '_' + S.boot.today + '.csv', 'text/csv');
}
function downloadText(txt, filename, mime) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: mime })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}

  const days = Math.round((parseYMD(t.WarrantyExpires) - parseYMD(S.boot.today)) / 86400000);
  if (days < 0) return { label: 'Expired ' + pretty(t.WarrantyExpires), cls: 'Expired', days };
  return { label: (days <= 60 ? '⚠ ' : '') + 'Until ' + pretty(t.WarrantyExpires) + ', ' + t.WarrantyExpires.slice(0, 4), cls: days <= 60 ? 'Pending' : 'Active', days };

function drawJobCharts() {

  Chart.defaults.color = cssVar('--text-2'); Chart.defaults.borderColor = grid; Chart.defaults.font.family = 'system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
  const tip = { backgroundColor: cssVar('--surface'), titleColor: cssVar('--text'), bodyColor: cssVar('--text-2'), borderColor: cssVar('--border-strong'), borderWidth: 1, padding: 10 };
  S.charts.push(new Chart($('#jbWeek'), { type: 'bar',
    data: { labels: r.byWeek.map(w => pretty(w.week)), datasets: [
      { label: 'Labor', data: r.byWeek.map(w => w.labor), backgroundColor: series[0], borderColor: surface, borderWidth: { top: 2 }, maxBarThickness: 34 },

    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { color: grid }, ticks: { callback: v => money0(v) }, border: { display: false } } },
      plugins: { legend: { position: 'top', align: 'start', labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: Object.assign({}, tip, { callbacks: { label: c => ` ${c.dataset.label}: ${money0(c.parsed.y)}` } }) } } }));
  S.charts.push(new Chart($('#jbEmp'), { type: 'bar',
    data: { labels: r.byEmployee.map(e => e.name), datasets: [{ label: 'Hours', data: r.byEmployee.map(e => e.hours), backgroundColor: series[0], borderRadius: 4, borderSkipped: false, maxBarThickness: 26 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: grid }, ticks: { callback: v => v + ' h' }, border: { display: false } }, y: { grid: { display: false } } },
      plugins: { legend: { display: false }, tooltip: Object.assign({}, tip, { callbacks: { label: c => ` ${hrs(c.parsed.x)} h` } }) } } }));
}

function payFinalize() {

  if (!confirm(`Finalize payroll for ${pretty(S.pay.start)} – ${pretty(S.pay.end)}?\n\nExpected payout (pre-tax): ${money(T.payout)}` + (T.warnings ? `\n\n⚠ ${T.warnings} warning(s) – unapproved hours/expenses are NOT included.` : ''))) return;
  call('adminFinalizePayroll', S.token, S.pay.start).then(r => { toast('Payroll finalized: ' + r.runId, 'good'); viewPayroll(S.pay.start); }).catch(fail);
}
function payVoid(id) {
  if (!confirm('Void payroll ' + id + '? Its reimbursed expenses become unpaid again so they show in the next payroll.')) return;
  call('adminVoidPayrollRun', S.token, id).then(() => { toast('Payroll voided.', 'good'); viewPayroll(S.pay.start); }).catch(fail);
}
function payEmail(id) {
  if (!confirm('Email every employee in this payroll their pre-tax pay summary? (They also see it in the app.)')) return;
  call('adminEmailPaySummaries', S.token, id).then(r => toast(`${r.sent} pay summar${r.sent === 1 ? 'y' : 'ies'} emailed.` + (r.skipped.length ? ' Skipped: ' + r.skipped.join(', ') : ''), 'good')).catch(fail);
}

  $('#main').innerHTML = `
    <div class="card"><div class="cardhead"><h2>Backups</h2><button class="btn primary" onclick="backupNow()">Back up now</button></div>
      <p class="small muted" style="margin-top:0">A full copy of the database is saved in your Drive folder <b>Backups</b> every night (Settings → AutoBackup), and automatically before any clear or restore. Receipt photos stay in Drive and are not affected.</p>
      <div class="tablewrap" style="max-height:340px"><table><tr><th>Backup</th><th>Created</th><th></th></tr>
      ${S.backups.map(b => `<tr><td><b>${esc(b.name)}</b></td><td class="nowrap">${esc(b.created)}</td><td class="nowrap"><a class="btn sm" href="${esc(b.url)}" target="_blank" rel="noopener">Open ${ICON.ext}</a> <button class="btn sm ghost danger" onclick="restoreBackup('${esc(b.id)}','${esc(b.name)}')">Restore</button></td></tr>`).join('') || '<tr><td colspan="3" class="muted">No backups yet – press “Back up now”.</td></tr>'}
      </table></div></div>
    <div class="card"><div class="cardhead"><h2>Trash</h2>${S.trash.length ? `<button class="btn sm ghost danger" onclick="purge('all')">Empty trash</button>` : ''}</div>
      <p class="small muted" style="margin-top:0">Anything deleted (timesheets, expenses, employees, job sites, tools) waits here until you restore it or empty the trash.</p>
      <div class="tablewrap" style="max-height:380px"><table><tr><th>Deleted</th><th>What</th><th>By</th><th></th></tr>
      ${S.trash.map(t => `<tr><td class="nowrap small">${esc(t.DeletedAt)}</td><td>${esc(t.Summary)}</td><td class="small">${esc(t.DeletedBy)}</td>
        <td class="nowrap"><button class="btn sm" onclick="restoreTrash('${esc(t.TrashID)}')">Restore</button> <button class="btn sm ghost danger" onclick="purge('${esc(t.TrashID)}')">Delete forever</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Trash is empty.</td></tr>'}
      </table></div></div>
    <div class="card"><h2>Clear data</h2>
      <p class="small muted" style="margin-top:0">Removes old or test records in bulk. A backup is made automatically first, so this can be undone with <b>Restore</b>. Employees, job sites and settings are never cleared here.</p>
      <div class="row">
        <div class="field"><label for="clrBefore">Clear records dated before</label><input type="date" id="clrBefore"></div>
        <label class="small" style="display:flex;gap:6px;align-items:center;min-height:38px"><input type="checkbox" id="clrAll"> Clear everything (ignore date)</label>
      </div>
      <div class="row" style="gap:14px;margin:10px 0">${[['timesheets', 'Timesheets & hours'], ['expenses', 'Expenses'], ['tools', 'Tools register'], ['notifications', 'Notifications'], ['audit', 'Audit log'], ['payroll', 'Payroll history'], ['trash', 'Trash']]
        .map(([k, l]) => `<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-clr="${k}" ${k === 'notifications' ? 'checked' : ''}> ${l}</label>`).join('')}</div>
      <button class="btn bad" onclick="clearData()">Clear selected data…</button><div id="clrOut" class="small" style="margin-top:8px"></div></div>`;
}
function backupNow() { call('adminBackupNow', S.token, 'manual').then(b => { S.backups = b; drawData(); toast('Backup saved to Drive.', 'good'); }).catch(fail); }
function restoreBackup(id, name) {
  const w = prompt(`Restore "${name}"?\n\nALL current data (timesheets, expenses, employees, settings…) will be replaced by this backup. A safety backup of the current data is made first.\n\nType RESTORE to continue:`);
  if (w === null) return;
  call('adminRestoreBackup', S.token, id, w.trim()).then(r => { toast('Restored ' + r.restored + '. Safety copy: ' + r.safety.name, 'good'); return call('getBoot', S.token); }).then(b => { if (b) S.boot = b; viewData(); }).catch(fail);
}
function restoreTrash(id) { call('adminRestoreTrash', S.token, id).then(t => { S.trash = t; drawData(); toast('Restored.', 'good'); call('getBoot', S.token).then(b => S.boot = b).catch(() => {}); }).catch(fail); }
function purge(id) {
  if (!confirm(id === 'all' ? 'Permanently delete everything in the trash? Receipt photos of deleted expenses go to the Drive bin.' : 'Permanently delete this item?')) return;
  call('adminPurgeTrash', S.token, id).then(t => { S.trash = t; drawData(); toast('Deleted permanently.', 'good'); }).catch(fail);
}
function clearData() {
  const all = $('#clrAll').checked, before = $('#clrBefore').value;
  if (!all && !before) return toast('Pick a date, or tick “Clear everything”.', 'bad');
  const opts = { before: all ? '' : before }; $$('[data-clr]').forEach(c => opts[c.dataset.clr] = c.checked);
  const what = $$('[data-clr]').filter(c => c.checked).map(c => c.parentNode.textContent.trim());
  if (!what.length) return toast('Tick at least one kind of data.', 'bad');
  const w = prompt(`Clear ${what.join(', ')} ${all ? '(EVERYTHING)' : 'dated before ' + before}?\n\nA backup is made first. Type DELETE to continue:`);
  if (w === null) return;
  call('adminClearData', S.token, opts, w.trim()).then(r => {
    $('#clrOut').innerHTML = 'Removed: ' + (Object.entries(r.removed).map(([k, v]) => `${v} ${k}`).join(', ') || 'nothing') + `. Backup: <a href="${esc(r.backup.url)}" target="_blank" rel="noopener">${esc(r.backup.name)}</a>`;
    toast('Data cleared. A backup was saved first.', 'good');
    call('adminListBackups', S.token).then(b => { S.backups = b; }).catch(() => {});
  }).catch(fail);
}

/* =====================================================================
   PHONE-APP FEATURES: install, offline, updates
   ===================================================================== */
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installCardHtml(force) {
  if (isStandalone()) return force ? `<div class="card" style="max-width:480px"><h3>App</h3><p class="small muted" style="margin:0">✓ EASTSIDER is installed on this device.</p></div>` : '';
  const inApps = !(window.google && google.script && google.script.host);
  if (!inApps && !force) return '';
  return `<div class="card installcard" style="max-width:480px">
    <div class="row" style="align-items:center;flex-wrap:nowrap">${LOGO(40)}<div style="flex:1"><b>Install the EASTSIDER app</b><div class="tiny">Opens in its own window with its own icon – separate from your Google accounts.</div></div>
    <button class="btn primary sm" onclick="installApp()">Install</button></div></div>`;
}
function installApp() {
  if (S.installEvt) { S.installEvt.prompt(); S.installEvt.userChoice.then(() => { S.installEvt = null; $$('.installbtn').forEach(b => b.classList.add('hidden')); }); return; }
  modal(`<h2>Install EASTSIDER</h2>${isIOS() ? `
    <ol class="small"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button <span aria-hidden="true">⬆︎</span>.</li><li>Scroll and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>` : `
    <ol class="small"><li>Open this page in <b>Chrome</b> (or Edge / Samsung Internet).</li><li>Tap the <b>⋮</b> menu.</li><li>Tap <b>Install app</b> (or <b>Add to Home screen</b>).</li></ol>
    <p class="small muted">On a computer: click the install icon at the right end of the address bar.</p>`}
    <p class="tiny">The installed app keeps you signed in and opens in its own window.</p><button class="btn" onclick="closeOverlay()">OK</button>`);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; $$('.installbtn').forEach(b => b.classList.remove('hidden')); });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('EASTSIDER installed.', 'good'); });
function updateOnline() { const o = $('#offline'); if (o) o.classList.toggle('hidden', navigator.onLine !== false); }
window.addEventListener('online', () => { updateOnline(); toast('Back online.', 'good'); });
window.addEventListener('offline', updateOnline);
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('controllerchange', () => { if (S.swReady) toast('EASTSIDER was updated – reload to use the newest version.'); S.swReady = true; });

/* ---------- boot ---------- */
window.addEventListener('beforeunload', ev => { if (S.ts && S.ts.dirty && S.tab === 'timesheet') { ev.preventDefault(); ev.returnValue = ''; } });
applyTheme();
(function init() {
  const t = store.get('ct_token') || sstore.get('ct_token');
  if (!t) return renderLogin();
  S.token = t;
  call('getBoot', t).then(b => { S.boot = b; startApp(); }).catch(() => renderLogin());
})();
</script>

</body>
</html>
